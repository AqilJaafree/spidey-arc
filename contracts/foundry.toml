[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Spec §4: "Solidity 0.8.26+, Foundry".
solc = "0.8.28"

# §8.2 relies on EIP-1153 TSTORE/TLOAD for the reentrancy guard. Verified
# supported on Arc testnet (chain 5042002, reth v1.11.3): a TSTORE/TLOAD probe
# via eth_call returns correctly, as do MCOPY and BLOBBASEFEE.
evm_version = "cancun"

optimizer = true
# Rebalancing is the vault's recurring cost (§8), so optimize for runtime gas
# rather than deploy size. Nothing here is near the contract size limit.
optimizer_runs = 20000

via_ir = true

gas_reports = ["LPVault", "ScoreOracle", "Router"]

fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
